server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 4g;
    client_body_timeout 600s;
    client_body_buffer_size 16m;

    # Docker embedded DNS — re-resolve api hostname so recreate doesn't stick to old IP
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # Variable forces runtime DNS; keep full URI (no path rewrite on proxy_pass)
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 4g;
    }

    location /health {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
