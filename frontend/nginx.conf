server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16g;
    client_body_timeout 1200s;
    client_body_buffer_size 16m;

    # Docker embedded DNS — re-resolve api hostname so recreate doesn't stick to old IP
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # Variable forces runtime DNS; keep full URI (no path rewrite on proxy_pass)
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_connect_timeout 60s;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 16g;
    }

    location /health {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream/health;
    }

    # 入口 HTML 不缓存，保证发版后浏览器立刻拿到新资源引用
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # 带 hash 的静态资源可长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
