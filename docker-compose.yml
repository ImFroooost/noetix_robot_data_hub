services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: motion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motion_pass}
      POSTGRES_DB: motion
    volumes:
      # NTFS/护照盘不能 chmod，Postgres 数据放 Docker 卷（系统盘）
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motion"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: ./backend
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg2://motion:${POSTGRES_PASSWORD:-motion_pass}@db:5432/motion
      REDIS_URL: redis://redis:6379/0
      DATA_ROOT: /data
      HUB_REPO_ROOT: /hub_repo
      SECRET_KEY: ${SECRET_KEY:-please_change_this_secret_key_in_env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - ./data/files:/data
      - ./data/hub_repo:/hub_repo
      - ${HOST_IMPORT_DIR:-/home/noetix/Downloads}:/import_inbox:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  worker:
    build: ./backend
    environment: *backend_env
    volumes:
      - ./data/files:/data
      - ./data/hub_repo:/hub_repo
      - ${HOST_IMPORT_DIR:-/home/noetix/Downloads}:/import_inbox:ro

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: rq worker motion --url redis://redis:6379/0
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
